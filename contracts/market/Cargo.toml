[package]
name = "sanctuary-market"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.7.0", features = ["legacy"] }
near-sys = "=0.2.2"

[dev-dependencies]
near-sdk = { version = "=5.7.0", features = ["unit-testing", "legacy"] }
time = "=0.3.36"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
