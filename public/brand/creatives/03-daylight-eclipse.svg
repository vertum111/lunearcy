<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">Daylight and eclipse game mechanic</title><rect width="1200" height="675" fill="#173B35"/><rect x="600" width="600" height="675" fill="#382734"/><image href="data:image/svg+xml;base64," x="64" y="40" width="280" height="45.4054054054054"/><text x="64" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#A6C96A">PUBLIC DEVLOG / 03</text><text x="60" y="222" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#EEF0D5">Same valley. Different opportunities.</text><g><circle cx="320" cy="361" r="48" fill="#D5DEA2"/><g stroke="#D5DEA2" stroke-width="5" stroke-linecap="round"><path d="M320 285V269 M320 453V437 M244 361H228 M412 361H396 M267 308L255 296 M373 414L385 426 M267 414L255 426 M373 308L385 296"/></g><circle cx="880" cy="361" r="49" fill="#D46A60"/><circle cx="899" cy="345" r="45" fill="#382734"/></g><text x="231" y="491" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#A6C96A">DAYLIGHT</text><text x="798" y="491" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#E4938B">ECLIPSE</text><text x="165" y="538" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#D4DFC2">Grow. Craft. Prepare.</text><text x="732" y="538" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#E1BCC4">Explore. Find. Return.</text><path d="M600 275V610" stroke="#A6C96A" stroke-opacity=".3"/><text x="64" y="627" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C3D6BD">A changing world, with useful reasons to play in both states.</text></svg>