<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title"><title id="title">Three dragons with useful jobs</title><rect width="1200" height="675" fill="#173B35"/><image href="data:image/svg+xml;base64," x="64" y="40" width="280" height="45.4054054054054"/><text x="64" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#A6C96A">PUBLIC DEVLOG / 02</text><text x="60" y="222" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#EEF0D5">Three dragons. One working valley.</text><g fill="none" stroke="#A6C96A" stroke-width="2"><path d="M64 268H1136"/></g><g><rect x="64" y="302" width="340" height="270" rx="20" fill="#234D40"/><g transform="translate(86 320) scale(2)" fill="none" stroke="#B6D776" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8C10 7 4 15 6 26C8 36 23 37 29 27C33 20 31 13 31 8Z M6 36L24 17"/></g><text x="88" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B6D776">WOODLAND</text><text x="88" y="487" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#EEF0D5">Grow food.</text><text x="88" y="529" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C3D6BD">Berries help young dragons grow.</text></g><g><rect x="434" y="302" width="340" height="270" rx="20" fill="#234D40"/><g transform="translate(456 320) scale(2)" fill="none" stroke="#E19168" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4C23 14 9 16 9 27C9 40 30 40 30 27C30 21 28 17 25 14C26 23 17 22 19 4Z"/></g><text x="458" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#E19168">FIRE</text><text x="458" y="487" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#EEF0D5">Refine materials.</text><text x="458" y="529" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C3D6BD">Heat turns resources into craft.</text></g><g><rect x="804" y="302" width="340" height="270" rx="20" fill="#234D40"/><g transform="translate(826 320) scale(2)" fill="none" stroke="#B7C3D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4L31 15L28 36H11L7 15Z M20 4V36 M7 15H31"/></g><text x="828" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#B7C3D4">STONE</text><text x="828" y="487" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#EEF0D5">Find ore.</text><text x="828" y="529" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#C3D6BD">Minerals unlock useful upgrades.</text></g><text x="64" y="627" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#C3D6BD">Care becomes progress.</text></svg>